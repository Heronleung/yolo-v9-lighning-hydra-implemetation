ema:
  decay: 0.9999
  tau: 2000
checkpoint:
  monitor: fitness
  mode: max
  save_last: true
  save_period: -1
close_mosaic:
  disable_at: ${close_mosaic}
early_stopping:
  patience: 100
plots:
  enabled: true
  csv_name: results.csv
  results_name: results.png
  confusion_matrix:
    enabled: true
    conf: 0.25
    iou_thres: 0.45
