[project]
name = "yolov9-main"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "albumentations==1.3.1",
    "gitpython>=3.1.57",
    "hydra-core>=1.3.3",
    "ipython>=9.16.0",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "numpy<2",
    "omegaconf>=2.3.1",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "setuptools<81",
    "tensorboard>=2.21.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "thop>=0.1.1.post2209072238",
]

[tool.pytest.ini_options]
pythonpath = ["."]
